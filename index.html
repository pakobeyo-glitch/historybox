<!DOCTYPE html>

<html lang="sk">

<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tvorba sveta</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- HLAVIČKA -->

<header>

    <div class="logo">
        🌍 TVORBA SVETA
    </div>

    <div class="header-buttons">

        <button id="saveButton">
            💾 Uložiť
        </button>

        <button id="loadButton">
            📂 Načítať
        </button>

        <button id="clearButton">
            🗑️ Vymazať
        </button>

    </div>

</header>


<!-- HLAVNÉ ROZHRANIE -->

<main>

    <!-- ĽAVÝ PANEL -->

    <aside class="sidebar">


        <!-- VRSTVY -->

        <section>

            <h2>VRSTVY</h2>

            <button
                class="layer-button active"
                id="terrainLayer"
            >
                🟢 TERÉN
            </button>

            <button
                class="layer-button"
                id="areaLayer"
            >
                🟠 OBLASTI
            </button>

            <button
                class="layer-button"
                id="countryLayer"
            >
                🔴 KRAJINY
            </button>

        </section>


        <!-- TERÉNY -->

        <section id="terrainPanel">

            <h2>TERÉNY</h2>

            <button
                class="terrain-button"
                data-terrain="sea"
            >
                🌊 More
            </button>

            <button
                class="terrain-button"
                data-terrain="lowland"
            >
                🟩 Nížina
            </button>

            <button
                class="terrain-button"
                data-terrain="forest"
            >
                🌲 Les
            </button>

            <button
                class="terrain-button"
                data-terrain="desert"
            >
                🟨 Púšť
            </button>

            <button
                class="terrain-button"
                data-terrain="mountains"
            >
                ⛰️ Hory
            </button>

            <button
                class="terrain-button"
                data-terrain="high_mountains"
            >
                🏔️ Veľhory
            </button>

            <button
                class="terrain-button"
                data-terrain="tundra"
            >
                🧊 Tundra
            </button>

            <button
                class="terrain-button"
                data-terrain="river"
            >
                💧 Rieka
            </button>

        </section>


        <!-- NÁSTROJE -->

        <section>

            <h2>NÁSTROJE</h2>

            <button id="brushButton">
                🖌️ Štetec
            </button>

            <button id="eraserButton">
                🧹 Guma
            </button>

            <label class="slider-label">

                Veľkosť štetca

                <input
                    type="range"
                    id="brushSize"
                    min="1"
                    max="8"
                    value="1"
                >

                <span id="brushSizeValue">
                    1
                </span>

            </label>

        </section>


        <!-- OBLASTI -->

        <section id="areaPanel" class="hidden">

            <h2>OBLASTI</h2>

            <button id="newAreaButton">
                ➕ Nová oblasť
            </button>

            <div id="areaList"></div>

        </section>


        <!-- KRAJINY -->

        <section id="countryPanel" class="hidden">

            <h2>KRAJINY</h2>

            <button id="newCountryButton">
                ➕ Nová krajina
            </button>

            <div id="countryList"></div>

        </section>


        <!-- ZOOM -->

        <section>

            <h2>MAPA</h2>

            <div class="zoom-controls">

                <button id="zoomOut">
                    −
                </button>

                <span id="zoomValue">
                    100%
                </span>

                <button id="zoomIn">
                    +
                </button>

            </div>

            <button id="resetView">
                🎯 Celá mapa
```
